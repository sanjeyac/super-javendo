# Pad Xbox 360/One (driver xpad), API joystick Linux. Vedi easysmx.cfg per il formato.
# js: 0=A 1=B 2=X 3=Y 4=LB 5=RB 6=Back 7=Start; assi 0/1 = stick sinistro, 6/7 = croce.
type=gamepad
name=Xbox
threshold=12000

up=AXIS_7-,AXIS_1-
down=AXIS_7+,AXIS_1+
left=AXIS_6-,AXIS_0-
right=AXIS_6+,AXIS_0+
b=BUTTON_0
a=BUTTON_1
y=BUTTON_2
x=BUTTON_3
l=BUTTON_4,AXIS_2+
r=BUTTON_5,AXIS_5+
select=BUTTON_6
start=BUTTON_7

# Stato rapido (slot 0): click stick sinistro / destro.
save_state=BUTTON_9
load_state=BUTTON_10
