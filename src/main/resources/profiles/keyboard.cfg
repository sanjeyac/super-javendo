# Tastiera, giocatore 1. Un pulsante SNES per riga: <pulsante>=<tasto>[,<tasto>...]
# I tasti usano i nomi Linux (linux/input-event-codes.h): KEY_A..KEY_Z, KEY_0..KEY_9, KEY_UP, KEY_ENTER, ...
# Nota: KEY_1 è riservato (salva stato, con Shift carica).
type=keyboard
name=Keyboard P1

up=KEY_UP
down=KEY_DOWN
left=KEY_LEFT
right=KEY_RIGHT
b=KEY_Z
a=KEY_X
y=KEY_A
x=KEY_S
l=KEY_Q
r=KEY_W
start=KEY_ENTER
select=KEY_LEFTSHIFT

# Stato rapido (slot 0): salva/carica. I tasti 1-4 salvano negli slot 1-4, Shift+tasto carica.
save_state=KEY_F5
load_state=KEY_F9
