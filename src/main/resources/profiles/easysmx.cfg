# EasySMX / SHANWAN "Android Gamepad" (USB 0079:181c) in modalità DInput, API joystick Linux (/dev/input/js*).
# Per i gamepad i valori sono: BUTTON_<n> (n = numero js), AXIS_<n>+ / AXIS_<n>- (asse oltre la soglia).
# Si ricavano con `jstest /dev/input/js0`. Qui: 0=A 1=B 3=X 4=Y 6=L1 7=R1 10=Select 11=Start, croce = assi 6/7.
# Più input sullo stesso pulsante: separati da virgola (es. l=BUTTON_6,BUTTON_8 per L1 e L2 insieme) oppure righe ripetute.
# SNES: B in basso, A a destra, Y a sinistra, X in alto (come la croce di un pad Xbox).
type=gamepad
name=EasySMX
threshold=12000

up=AXIS_7-,AXIS_1-
down=AXIS_7+,AXIS_1+
left=AXIS_6-,AXIS_0-
right=AXIS_6+,AXIS_0+
b=BUTTON_0
a=BUTTON_1
y=BUTTON_3
x=BUTTON_4
l=BUTTON_6,BUTTON_8
r=BUTTON_7,BUTTON_9
select=BUTTON_10
start=BUTTON_11

# Stato rapido (slot 0). 13=click stick sinistro, 14=click stick destro (da verificare con jstest).
save_state=BUTTON_13
load_state=BUTTON_14
